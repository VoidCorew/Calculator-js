<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="calculator-wrapper">
    <div class="calculator-top">
      <input type="text" class="calculator-input">
      <p class="calculator-answer">=12,454</p>
    </div>
    <div class="calculator-bottom">
      <div class="button-small">e</div>
      <div class="button-small">µ</div>
      <div class="button-small">sin</div>
      <div class="button-small">deg</div>

      <div class="button-medium">Ac</div>
      <div class="button-medium">く</div>
      <div class="button-medium">/</div>
      <div class="button-medium">*</div>

      <div class="button-medium">7</div>
      <div class="button-medium">8</div>
      <div class="button-medium">9</div>
      <div class="button-medium">-</div>

      <div class="button-medium">4</div>
      <div class="button-medium">5</div>
      <div class="button-medium">6</div>
      <div class="button-medium">+</div>

      <div class="button-medium">1</div>
      <div class="button-medium">2</div>
      <div class="button-medium">3</div>
      <div class="button-large equals">=</div>

      <div class="button-large zero">0</div>
      <div class="button-medium">.</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
